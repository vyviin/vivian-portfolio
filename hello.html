<head>

  <link rel="icon" type="image/x-icon" href="favicon.PNG">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var night = stored ? stored === 'night' : (function () {
          var h = new Date().getHours();
          return h >= 19 || h < 7;
        })();
        if (night) document.documentElement.setAttribute('data-theme', 'night');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">

  <nav class="inner-nav" id="mainNav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo dark">vy.</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link dark">home</a>
        <a href="projects.html" class="nav-link dark">projects</a>
        <a href="hello.html" class="nav-link dark active">connect</a>
        <button class="theme-toggle dark" id="themeToggle" type="button" aria-label="Toggle day and night mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="inner-main hello-main">
    <div class="hello-layout">
      <!-- Text + composer -->
      <div class="hello-left">
        <div class="inner-header">
          <p class="section-eyebrow">leave a message</p>
          <h1 class="section-title">Say Hello</h1>
          <p class="section-subtitle">Fold a note, tuck it into the jar, and it'll sit there for every visitor after you.</p>
        </div>

        <div class="composer-panel">
          <div class="swatch-row" id="swatchRow" role="radiogroup" aria-label="Choose a colour">
            <button type="button" class="swatch" data-color="pink"  style="--swatch-color: var(--star-pink);"  aria-label="pink"  aria-checked="true"  role="radio"></button>
            <button type="button" class="swatch" data-color="lemon" style="--swatch-color: var(--star-lemon);" aria-label="lemon" aria-checked="false" role="radio"></button>
            <button type="button" class="swatch" data-color="mint"  style="--swatch-color: var(--star-mint);"  aria-label="mint"  aria-checked="false" role="radio"></button>
            <button type="button" class="swatch" data-color="sky"   style="--swatch-color: var(--star-sky);"   aria-label="sky"   aria-checked="false" role="radio"></button>
          </div>

          <button type="button" class="paper" id="paper" style="--paper-color: var(--star-pink);" aria-haspopup="dialog">
            <span class="paper-crease paper-crease--v"></span>
            <span class="paper-crease paper-crease--h"></span>
            <span class="paper-hint">tap to write</span>
          </button>
        </div>
      </div>

      <!-- Jar — top aligned with "Say Hello", caption text aligned with the paper's bottom -->
      <div class="hello-right">
        <div class="jar-panel">
          <div class="jar" id="jar" aria-label="Jar of messages from visitors">
            <svg class="jar-svg" viewBox="0 0 320 380" aria-hidden="true">
              <rect class="jar-lid" x="85" y="18" width="150" height="26" rx="8" />
              <rect class="jar-neck" x="95" y="40" width="130" height="20" rx="6" />
              <path class="jar-body" d="M50,60 Q40,60 40,90 L40,320 Q40,360 80,360 L240,360 Q280,360 280,320 L280,90 Q280,60 270,60 Z" />
            </svg>
            <div class="jar-stars" id="jarStars"></div>
          </div>
          <p class="jar-count" id="jarCount">loading messages…</p>
          <p class="jar-hint">tap a star to unfold it and read what they wrote</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Overlay + dialogs (write + read), reusing the same expand/blur idiom -->
  <div class="hello-overlay" id="helloOverlay">
    <div class="hello-card" id="composeCard" role="dialog" aria-modal="true" aria-label="Write your message" hidden>
      <div class="composer-textarea-wrap">
        <div class="composer-textarea" id="composerTextarea" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="write something kind…"></div>
      </div>
      <p class="composer-count"><span id="charCount">280</span> characters left</p>
      <p class="composer-error" id="composerError" hidden></p>
      <input type="text" name="website" id="honeypot" class="honeypot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="hello-card-actions">
        <button type="button" class="btn-secondary" id="closeComposeBtn">close</button>
        <button type="button" class="btn-primary" id="doneBtn">done</button>
      </div>
    </div>

    <div class="hello-card hello-card--read" id="readCard" role="dialog" aria-modal="true" aria-label="Message" hidden>
      <p class="read-card-body" id="readCardBody"></p>
      <div class="hello-card-actions">
        <button type="button" class="btn-secondary" id="closeReadBtn">close</button>
      </div>
    </div>
  </div>

  <!-- Transient element used only during the fold → star → jar animation -->
  <div class="fold-star" id="foldStar" hidden aria-hidden="true">
    <svg viewBox="0 0 24 24"><polygon points="12,1 15,9 23,9 16.5,14 19,22 12,17 5,22 7.5,14 1,9 9,9" /></svg>
  </div>
